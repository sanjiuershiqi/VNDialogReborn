name: Build

on:
  push:
    branches: ['**']
    tags: ['v*', 'v*.*', 'v*.*.*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNDialogReborn-mod
          # archivesName=VNDialogReborn, version=1.1-NEOFORGE-1.21.1
          # Main jar excludes -sources and -javadoc.
          path: |
            build/libs/VNDialogReborn-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VNDialogReborn-mod
          path: ./release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

  prerelease:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VNDialogReborn-mod
          path: ./prerelease-assets

      - name: Update latest prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: ./prerelease-assets/*.jar
          tag_name: latest
          name: Latest Build (master)
          body: |
            自动构建的最新版本，基于 master 分支最新提交。

            下载后替换旧 jar 即可使用。
          prerelease: true
          generate_release_notes: false
          make_latest: false

